name: Test basic dry-run usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          on-fail: 'none'
          required-metrics: 'prMergeRate,accountAge'
          analysis-window: '12'
          minimum-stars: '100'
          enable-spam-detection: 'true'
          verbose-details: 'none'
        continue-on-error: true

      - name: Assert outputs exist
        env:
          PASSED: ${{ steps.action.outputs.passed }}
          PASSED_COUNT: ${{ steps.action.outputs.passed-count }}
          TOTAL_METRICS: ${{ steps.action.outputs.total-metrics }}
          BREAKDOWN: ${{ steps.action.outputs.breakdown }}
          WAS_WHITELISTED: ${{ steps.action.outputs.was-whitelisted }}
        run: |
          echo "passed: $PASSED"
          echo "passed-count: $PASSED_COUNT"
          echo "total-metrics: $TOTAL_METRICS"
          echo "breakdown: $BREAKDOWN"
          echo "was-whitelisted: $WAS_WHITELISTED"

          # The action should have produced some output (even if it errored due to no real PR)
          # We verify the step ran and outputs are accessible (may be empty if no PR context)
          echo "PASS: action step completed"
