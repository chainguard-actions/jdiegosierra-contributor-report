name: Test basic dry-run usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create PR event payload
        run: |
          mkdir -p /tmp/event
          cat > /tmp/event/pull_request.json << 'EOF'
          {
            "action": "opened",
            "number": 1,
            "pull_request": {
              "number": 1,
              "user": {
                "login": "octocat"
              },
              "head": {
                "ref": "feature-branch",
                "sha": "abc123"
              },
              "base": {
                "ref": "main",
                "sha": "def456"
              }
            },
            "repository": {
              "name": "Hello-World",
              "owner": {
                "login": "octocat"
              }
            }
          }
          EOF

      - id: action
        uses: .
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: /tmp/event/pull_request.json
          GITHUB_REPOSITORY: octocat/Hello-World
          GITHUB_REF: refs/pull/1/merge
          GITHUB_HEAD_REF: feature-branch
          GITHUB_BASE_REF: main
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          on-fail: 'none'
          required-metrics: 'prMergeRate,accountAge'
          analysis-window: '12'
          minimum-stars: '100'
          enable-spam-detection: 'true'
          verbose-details: 'none'
        continue-on-error: true

      - name: Assert action ran and produced outputs or failed gracefully
        env:
          PASSED: ${{ steps.action.outputs.passed }}
          TOTAL: ${{ steps.action.outputs.total-metrics }}
          BREAKDOWN: ${{ steps.action.outputs.breakdown }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "passed: $PASSED"
          echo "total-metrics: $TOTAL"
          echo "breakdown: $BREAKDOWN"
          # The action should have run (either succeeded or failed gracefully)
          # If it failed, it should not be because of missing PR context
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PASSED" ] && [ -z "$TOTAL" ] && [ -z "$BREAKDOWN" ]; then
              echo "FAIL: action succeeded but no outputs were set"
              exit 1
            fi
            echo "PASS: action produced outputs"
          else
            echo "PASS: action ran (failed gracefully due to API limitations in test environment)"
          fi
