name: Test basic dry-run usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          on-fail: 'none'
          enable-spam-detection: 'false'
          required-metrics: 'prMergeRate,accountAge'
          analysis-window: '12'
          minimum-stars: '100'
        continue-on-error: true

      - name: Assert action ran and produced outputs
        env:
          PASSED: ${{ steps.action.outputs.passed }}
          TOTAL: ${{ steps.action.outputs.total-metrics }}
          BREAKDOWN: ${{ steps.action.outputs.breakdown }}
        run: |
          echo "passed: $PASSED"
          echo "total-metrics: $TOTAL"
          echo "breakdown: $BREAKDOWN"
          # The action should have run and produced some output
          # In dry-run mode it should not fail the workflow
          echo "PASS: action completed in dry-run mode"
