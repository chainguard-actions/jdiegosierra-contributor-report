name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          trusted-users: 'dependabot[bot],renovate[bot],github-actions[bot]'
          on-fail: 'none'
          dry-run: 'true'
          enable-spam-detection: 'true'
          required-metrics: 'prMergeRate,accountAge'
          minimum-stars: '100'
          analysis-window: '12'
          verbose-details: 'none'
          new-account-action: 'neutral'
          new-account-threshold-days: '30'
        continue-on-error: true
      - name: Assert outputs exist
        run: |
          echo "passed: ${{ steps.action.outputs.passed }}"
          echo "passed-count: ${{ steps.action.outputs.passed-count }}"
          echo "total-metrics: ${{ steps.action.outputs.total-metrics }}"
          echo "was-whitelisted: ${{ steps.action.outputs.was-whitelisted }}"
          echo "PASS: action ran without crashing"
