name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          threshold-pr-merge-rate: '0.5'
          threshold-account-age: '30'
          threshold-positive-reactions: '0'
          threshold-negative-reactions: '10'
          dry-run: 'true'
          on-fail: 'none'
          trusted-users: 'dependabot[bot],renovate[bot],github-actions[bot]'
        continue-on-error: true
      - name: Assert outputs exist
        env:
          PASSED: ${{ steps.action.outputs.passed }}
          TOTAL: ${{ steps.action.outputs.total-metrics }}
        run: |
          echo "passed: $PASSED"
          echo "total-metrics: $TOTAL"
          echo "PASS: action ran and produced outputs"
