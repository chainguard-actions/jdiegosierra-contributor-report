name: Test - Custom Threshold Inputs Accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom threshold inputs (expect failure - no PR context)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          threshold-pr-merge-rate: '0.5'
          threshold-account-age: '90'
          threshold-positive-reactions: '5'
          threshold-negative-reactions: '2'
          threshold-merger-diversity: '3'
          threshold-repo-history-merge-rate: '0.3'
          threshold-repo-history-min-prs: '2'
          threshold-profile-completeness: '50'
          required-metrics: 'prMergeRate,accountAge'
          minimum-stars: '50'
          analysis-window: '6'
          on-fail: 'none'
          dry-run: 'true'
          verbose-details: 'failed'
          new-account-action: 'neutral'
          new-account-threshold-days: '60'

      - name: Assert action failed due to missing PR context (not input parsing error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no PR context (workflow_dispatch),
          # NOT because of invalid threshold inputs.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in PR context, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (no PR context), all threshold inputs were accepted"
