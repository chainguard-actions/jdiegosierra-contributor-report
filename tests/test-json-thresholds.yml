name: Test - JSON Thresholds Input Accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with JSON thresholds and spam detection disabled
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          thresholds: '{"prMergeRate": 0.5, "accountAge": 90}'
          enable-spam-detection: 'false'
          on-fail: 'none'
          dry-run: 'true'
          label-name: 'contributor-review'

      - name: Assert action failed due to missing PR context (not JSON parse error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no PR context (workflow_dispatch),
          # NOT because of invalid JSON in the thresholds input.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in PR context, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (no PR context), JSON thresholds input was accepted"
