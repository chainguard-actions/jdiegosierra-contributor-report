name: Test on-fail label configuration
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          on-fail: 'comment-and-label'
          label-name: 'contributor-review-needed'
          required-metrics: 'prMergeRate,accountAge,profileCompleteness'
          threshold-pr-merge-rate: '0.7'
          threshold-account-age: '180'
          threshold-profile-completeness: '60'
          verbose-details: 'all'
        continue-on-error: true

      - name: Assert action fails with PR context error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because it's not running on a pull_request event
          # This confirms on-fail and label-name inputs are accepted
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing PR context, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when not on a pull_request event (on-fail label config accepted)"
