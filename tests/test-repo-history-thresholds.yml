name: Test repo history thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          dry-run: 'true'
          threshold-repo-history-merge-rate: '0.5'
          threshold-repo-history-min-prs: '2'
          on-fail: 'none'

      - name: Assert action ran or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "passed: $PASSED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PASSED" ]; then
              echo "FAIL: action succeeded but 'passed' output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with passed=$PASSED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
