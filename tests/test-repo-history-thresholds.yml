name: Test repo history thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          threshold-repo-history-merge-rate: '0.5'
          threshold-repo-history-min-prs: '1'
          dry-run: 'true'
          on-fail: 'none'
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (dry-run with repo history thresholds)"
          echo "passed: ${{ steps.action.outputs.passed }}"
          echo "passed-count: ${{ steps.action.outputs.passed-count }}"
          echo "total-metrics: ${{ steps.action.outputs.total-metrics }}"
          echo "PASS: action ran with threshold-repo-history-merge-rate and threshold-repo-history-min-prs inputs"
