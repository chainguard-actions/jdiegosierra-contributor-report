name: Test repo history and profile thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          threshold-repo-history-merge-rate: '0.1'
          threshold-repo-history-min-prs: '0'
          threshold-profile-completeness: '0'
          dry-run: 'true'
          on-fail: 'none'
          trusted-users: 'dependabot[bot],renovate[bot],github-actions[bot]'
        continue-on-error: true
      - name: Assert action ran
        env:
          PASSED: ${{ steps.action.outputs.passed }}
          RECOMMENDATIONS: ${{ steps.action.outputs.recommendations }}
        run: |
          echo "passed: $PASSED"
          echo "recommendations: $RECOMMENDATIONS"
          echo "Action completed (dry-run mode)"
          echo "PASS"
