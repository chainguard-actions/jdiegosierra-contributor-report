name: Test threshold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          threshold-merger-diversity: '2'
          threshold-repo-history-merge-rate: '0.5'
          threshold-repo-history-min-prs: '1'
          threshold-profile-completeness: '50'
          dry-run: 'true'
          on-fail: 'none'
          enable-spam-detection: 'false'
          verbose-details: 'all'
        continue-on-error: true
      - name: Assert outputs exist
        env:
          PASSED: ${{ steps.action.outputs.passed }}
          BREAKDOWN: ${{ steps.action.outputs.breakdown }}
        run: |
          echo "passed: $PASSED"
          echo "breakdown: $BREAKDOWN"
          echo "PASS: action ran with threshold inputs"
