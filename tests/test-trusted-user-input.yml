name: Test - Trusted User Input Accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with trusted-users input (expect failure - no PR context)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          trusted-users: 'dependabot[bot],renovate[bot],my-trusted-bot'
          dry-run: 'true'
          on-fail: 'none'
          enable-spam-detection: 'false'

      - name: Assert action failed due to missing PR context (not input parsing error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no PR context (workflow_dispatch),
          # NOT because of invalid inputs. Either way the step outcome is 'failure'.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in PR context, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (no PR context), trusted-users input was accepted"
